# Clinic production: one Windows PC runs this app and MySQL.
# Other computers open a browser to that PC. H2 is not used here.
# Run with: --spring.profiles.active=production

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10

# Schema changes are Flyway migrations only. Hibernate must not alter tables.
bayport.flyway.repair-before-migrate=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
# V1–V13 stay in the folder for databases that already applied them.
# A new database is baselined at version 13, so those older files are ignored.
spring.flyway.ignore-migration-patterns=*:ignored

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

spring.h2.console.enabled=false

server.port=${BAYPORT_SERVER_PORT:8080}
server.address=0.0.0.0
# Keystore path and password come from SERVER_SSL_KEY_STORE and SERVER_SSL_KEY_STORE_PASSWORD
# when HTTPS is turned on. They are omitted here so a blank value is not treated as a keystore.
server.ssl.enabled=${BAYPORT_SSL_ENABLED:false}
bayport.security.allow-lan-http=${BAYPORT_ALLOW_LAN_HTTP:false}

spring.web.cors.allowed-origins=${SPRING_WEB_CORS_ALLOWED_ORIGINS:}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=Authorization,Content-Type,Accept,X-Requested-With
spring.web.cors.allow-credentials=true

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:28800000}

bayport.storage.provider=${BAYPORT_STORAGE_PROVIDER:local}
bayport.upload-dir=${BAYPORT_UPLOAD_DIR:./data/uploads}
bayport.frontend.dir=${BAYPORT_FRONTEND_DIR:}

logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.com.bayport=INFO
logging.file.name=${BAYPORT_LOG_FILE:logs/bayport.log}
