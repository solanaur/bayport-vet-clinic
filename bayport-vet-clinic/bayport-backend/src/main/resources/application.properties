# Database Configuration
# Default: embedded H2 (no MySQL required). For MySQL Workbench use: SPRING_PROFILES_ACTIVE=default
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# MySQL (active when profile "default" / unset h2 — see application.properties below)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bayport_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway — runs SQL in src/main/resources/db/migration on startup (was missing from pom before; add deps + restart).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# Spring Boot 3.3 ignores spring.flyway.repair-on-migrate; use FlywayRepairConfig + bayport.flyway.repair-before-migrate instead.
bayport.flyway.repair-before-migrate=true

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# File Upload Configuration
bayport.upload-dir=uploads

# Server Configuration
server.port=8080
server.forward-headers-strategy=native

# CORS Configuration (for frontend integration)
spring.web.cors.allowed-origins=${SPRING_WEB_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,file://}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# ===== LOG LEVELS =====
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.com.bayport=INFO

# ===== LOG FILE OUTPUT =====
logging.file.name=logs/bayport.log
logging.logback.rollingpolicy.file-name-pattern=logs/bayport-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.max-file-size=10MB

#
# Logo in reminder emails (hosted URL — do not embed large base64 in HTML)
bayport.email.logo-url=${BAYPORT_EMAIL_LOGO_URL:https://bayport-vet-clinic-com.netlify.app/assets/logo.png}

# ===== EMAIL CONFIGURATION =====
# Local/desktop SMTP credentials come from env or bayport-vet-clinic/data/mail.env (gitignored).
# Cloud (freecloud) ignores SMTP and uses Brevo/Resend instead.
bayport.email.cloud-prefer-resend=false
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.debug=false
spring.mail.properties.mail.debug=false

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:28800000}
bayport.security.totp-encryption-key=${TOTP_ENCRYPTION_KEY:}
bayport.admin.username=${BAYPORT_ADMIN_USER:}
bayport.admin.password=${BAYPORT_ADMIN_PASSWORD:}
bayport.admin.email=${BAYPORT_ADMIN_EMAIL:}
bayport.security.login.max-failures=5
bayport.security.login.lock-seconds=900
bayport.security.otp.max-verify-attempts=5
bayport.security.rate-limit.login-max=20
bayport.security.rate-limit.otp-send-max=5
bayport.security.rate-limit.otp-verify-max=10
bayport.security.rate-limit.window-seconds=900

bayport.storage.provider=${BAYPORT_STORAGE_PROVIDER:local}

# SMS (optional). Leave disabled until a provider key is set.
# Semaphore (Philippines): BAYPORT_SMS_PROVIDER=semaphore, BAYPORT_SMS_API_KEY, BAYPORT_SMS_SENDER
# Twilio: BAYPORT_SMS_PROVIDER=twilio, BAYPORT_SMS_ACCOUNT_SID, BAYPORT_SMS_API_KEY is unused,
#         BAYPORT_SMS_API_SECRET=auth token, BAYPORT_SMS_SENDER=+1...
# Generic HTTPS gateway: BAYPORT_SMS_PROVIDER=http, BAYPORT_SMS_ENDPOINT, BAYPORT_SMS_API_KEY
bayport.sms.enabled=${BAYPORT_SMS_ENABLED:false}
bayport.sms.provider=${BAYPORT_SMS_PROVIDER:semaphore}
bayport.sms.api-key=${BAYPORT_SMS_API_KEY:}
bayport.sms.api-secret=${BAYPORT_SMS_API_SECRET:}
bayport.sms.sender=${BAYPORT_SMS_SENDER:Bayport}
bayport.sms.account-sid=${BAYPORT_SMS_ACCOUNT_SID:}
bayport.sms.endpoint=${BAYPORT_SMS_ENDPOINT:}

# Backups are stored outside the application folder. See docs/DEPLOYMENT.md.
bayport.backup.dir=${BAYPORT_BACKUP_DIR:}
bayport.backup.external-dir=${BAYPORT_BACKUP_EXTERNAL_DIR:}
bayport.backup.keep=${BAYPORT_BACKUP_KEEP:14}
bayport.backup.cron=${BAYPORT_BACKUP_CRON:0 15 2 * * *}
bayport.backup.mysqldump=${BAYPORT_MYSQLDUMP:}
bayport.backup.mysql=${BAYPORT_MYSQL:}
bayport.backup.verify-database=${BAYPORT_BACKUP_VERIFY_DATABASE:}
