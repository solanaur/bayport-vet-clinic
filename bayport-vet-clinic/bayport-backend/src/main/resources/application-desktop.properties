# Desktop Profile — embedded H2 (matches Electron shell; no MySQL required)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/bayport-db;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000}
spring.datasource.username=sa
spring.datasource.password=${BAYPORT_DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

spring.flyway.enabled=false

bayport.upload-dir=./data/uploads
server.port=8080

spring.web.cors.allowed-origins=${SPRING_WEB_CORS_ALLOWED_ORIGINS:file://,http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000,http://127.0.0.1:3000}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
bayport.email.cloud-prefer-resend=false

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:28800000}
app.tos.version=v1.0
