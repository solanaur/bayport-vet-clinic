<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Billing - Bayport</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/bayport-design.css">
  <style>
    :root { --soft-teal: #0F5CC0; --bill-green: #059669; --bill-amber: #d97706; --bill-red: #dc2626; --bp-primary: #0F5CC0; }
    body { font-family: Inter, system-ui, sans-serif; }
    .bill-drawer { transform: translateX(100%); }
    .bill-drawer.open { transform: translateX(0); }
    .bill-row-menu-btn{
      display:inline-flex;align-items:center;justify-content:center;
      width:2rem;height:2rem;border-radius:0.5rem;border:1px solid #e2e8f0;
      background:#fff;color:#475569;line-height:1;
    }
    .bill-row-menu-btn:hover,.bill-row-menu-btn[aria-expanded="true"]{
      background:#f8fafc;border-color:#cbd5e1;color:#0f172a;
    }
    .bill-actions-menu{
      min-width:11.5rem;padding:0.35rem;border-radius:0.75rem;
      border:1px solid #e2e8f0;background:#fff;
      box-shadow:0 10px 30px rgba(15,23,42,0.12);
    }
    .bill-actions-menu button{
      display:block;width:100%;text-align:left;padding:0.55rem 0.75rem;
      border:0;border-radius:0.5rem;background:transparent;
      font-size:0.875rem;color:#334155;cursor:pointer;
    }
    .bill-actions-menu button:hover{background:#f1f5f9;color:#0f172a}
    .bill-actions-menu button.is-danger{color:#b91c1c}
    .bill-actions-menu button.is-danger:hover{background:#fef2f2;color:#991b1b}
  </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">
  <header id="bpAppHeader"></header>

  <div id="billToast" class="fixed bottom-5 left-1/2 -translate-x-1/2 hidden z-[300] text-white text-sm font-semibold px-4 py-2 rounded-lg shadow-lg"></div>

  <div class="flex flex-1 min-h-0">
    <aside class="w-72 shrink-0 bg-white border-r border-slate-200 p-5 overflow-hidden">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Menu</h2>
      <nav id="sidebarNav" class="flex flex-col gap-1 text-sm"></nav>
    </aside>

    <main class="flex-1 min-w-0 flex flex-col">
      <div class="flex-1 min-w-0 p-5 lg:p-8 overflow-y-auto">
        <div class="max-w-6xl mx-auto space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
              <h1 class="bp-page-title tracking-tight">Billing</h1>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <button type="button" id="btnReceivePayment" class="bp-btn-primary">Receive payment</button>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4" id="kpiRow"></div>

          <div class="bp-table-panel overflow-hidden">
            <div class="p-4 lg:p-5 border-b border-slate-100 space-y-3">
              <div class="flex flex-wrap gap-2" id="tabRow"></div>
              <div class="flex flex-col lg:flex-row gap-3 lg:items-center">
                <div class="bp-search relative flex-1 min-w-0">
                  <svg class="bp-search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M11 18a7 7 0 100-14 7 7 0 000 14z"/></svg>
                  <input id="searchInp" type="search" class="bp-search-input w-full" placeholder="Search invoice, pet, or owner…" />
                </div>
                <div class="flex flex-wrap items-center gap-2 shrink-0">
                  <div>
                    <label class="sr-only" for="billPeriod">Filter by date</label>
                    <select id="billPeriod" class="block w-44">
                      <option value="day" selected>Today</option>
                      <option value="week">This week</option>
                      <option value="month">This month</option>
                      <option value="custom">Custom</option>
                    </select>
                  </div>
                  <div id="billCustomDates" class="hidden flex flex-wrap items-center gap-2">
                    <label class="bp-support-text flex items-center gap-2">From
                      <input id="dateFrom" type="date" />
                    </label>
                    <label class="bp-support-text flex items-center gap-2">To
                      <input id="dateTo" type="date" />
                    </label>
                  </div>
                  <button type="button" id="refreshBtn" class="inline-flex items-center justify-center w-10 h-10 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50" title="Refresh">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                  </button>
                </div>
              </div>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-sm text-left">
                <thead>
                  <tr>
                    <th>Invoice</th>
                    <th>Pet / Owner</th>
                    <th class="hidden md:table-cell">Date</th>
                    <th class="text-right">Amount</th>
                    <th>Status</th>
                    <th class="text-right w-14">Actions</th>
                  </tr>
                </thead>
                <tbody id="billingRows" class="divide-y divide-slate-100 bg-white"></tbody>
              </table>
            </div>

            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 px-4 py-3 border-t border-slate-100 text-sm text-slate-600">
              <span id="pageSummary">Showing 0 invoices</span>
              <div class="flex items-center gap-2">
                <button type="button" id="pagePrev" class="px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-50 disabled:opacity-40" disabled>Previous</button>
                <span id="pageNum" class="tabular-nums font-medium px-2">1</span>
                <button type="button" id="pageNext" class="px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-50 disabled:opacity-40" disabled>Next</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

      <!-- Detail drawer (overlay) -->
      <aside id="detailDrawer" class="bill-drawer fixed inset-y-0 right-0 z-[120] w-full max-w-md bg-white border-l border-slate-200 shadow-2xl flex flex-col">
        <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100">
          <h2 class="text-lg font-bold text-slate-900">Invoice details</h2>
          <button type="button" id="closeDrawer" class="p-2 rounded-lg hover:bg-slate-100 text-slate-500" aria-label="Close">&times;</button>
        </div>
        <div id="drawerBody" class="flex-1 overflow-y-auto px-5 py-4 text-sm text-slate-600"></div>
        <div id="drawerFooter" class="p-4 border-t border-slate-100 space-y-2 bg-slate-50/80"></div>
      </aside>

  <div id="backdrop" class="fixed inset-0 bg-black/30 z-[110] hidden"></div>

  <div id="previewModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-[200]">
    <div class="bg-white rounded-xl w-full flex flex-col shadow-xl overflow-hidden" style="width:min(920px, calc(100vw - 2rem));max-height:90vh">
      <div class="flex items-center justify-between px-4 py-3 border-b shrink-0 bg-white">
        <h3 class="font-semibold">Invoice preview</h3>
        <div class="flex items-center gap-2">
          <button type="button" id="printPreviewBtn" class="border rounded-md px-3 py-1.5 hover:bg-gray-50">Print</button>
          <button type="button" id="closePreviewBtn" class="border rounded-md px-3 py-1.5 hover:bg-gray-50">Close</button>
        </div>
      </div>
      <iframe id="previewFrame" class="w-full border-0 bg-white" style="height:80px" title="Invoice preview"></iframe>
    </div>
  </div>

  <div id="voidReasonModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-[220]">
    <div class="bg-white rounded-xl w-full max-w-md shadow-xl border border-slate-200 p-5 space-y-4">
      <div>
        <h3 class="text-lg font-semibold text-slate-900">Void invoice</h3>
        <p id="voidReasonLabel" class="text-sm text-slate-500 mt-1">Enter a reason for voiding this invoice.</p>
      </div>
      <label class="block text-xs font-medium text-slate-600">Reason <span class="text-red-500">*</span>
        <textarea id="voidReasonInput" rows="3" class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-[var(--soft-teal)]/25 focus:border-[var(--soft-teal)] outline-none" placeholder="e.g. Duplicate charge, entered in error…"></textarea>
      </label>
      <p id="voidReasonError" class="hidden text-xs text-red-600 font-medium">Enter at least 3 characters.</p>
      <div class="flex justify-end gap-2 pt-1">
        <button type="button" id="voidReasonCancel" class="px-4 py-2 rounded-lg border border-slate-200 text-sm font-medium hover:bg-slate-50">Cancel</button>
        <button type="button" id="voidReasonConfirm" class="px-4 py-2 rounded-lg bg-rose-600 text-white text-sm font-semibold hover:bg-rose-700">Void invoice</button>
      </div>
    </div>
  </div>

  <script src="assets/thermal-receipt.js"></script>
  <script src="assets/billing-checkout.js"></script>
  <script src="assets/deploy-env.js"></script>
  <script>window.USE_API = true;</script>
  <script src="assets/api.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/app-header.js"></script>
  <script>
    guard("billing");
    if (typeof initBayportAppHeader === "function") initBayportAppHeader(document.getElementById("bpAppHeader"), { accent: "soft-teal" });
    renderSidebar(document.getElementById("sidebarNav"), getRole(), "billing.html");

    let billing = [];
    let sales = [];
    let selectedId = null;
    let tab = "all";
    let page = 1;
    const pageSize = 15;

    function toast(msg, isError) {
      const el = document.getElementById("billToast");
      el.textContent = msg;
      el.classList.remove("hidden", "bg-emerald-600", "bg-rose-600");
      el.classList.add(isError ? "bg-rose-600" : "bg-emerald-600");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.add("hidden"), 3800);
    }

    function esc(v) {
      return String(v ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function fmtMoney(n) {
      const x = Number(n) || 0;
      return x.toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function fmtDateTime(v) {
      if (!v) return "—";
      const d = new Date(v);
      if (Number.isNaN(d.getTime())) return String(v).replace("T", " ").slice(0, 19);
      return d.toLocaleString(undefined, { dateStyle: "short", timeStyle: "short" });
    }

    function invoiceNo(r) {
      const y = r.issuedAt ? new Date(r.issuedAt).getFullYear() : new Date().getFullYear();
      return `INV-${y}-${String(r.id).padStart(4, "0")}`;
    }

    function parsePaymentMethod(note) {
      const n = String(note || "");
      const m = n.match(/Payment:\s*([^.|]+)/i);
      return m && m[1] ? m[1].trim() : "—";
    }

    /** POS sales do not always set billingId; match paid billing to a sale by pet, amount, and time. */
    function findSaleForBilling(r) {
      if (String(r.status || "").toUpperCase() !== "PAID" || !r.paidAt) return null;
      const paid = new Date(r.paidAt).getTime();
      const amt = Number(r.amount) || 0;
      let best = null;
      let bestDelta = Infinity;
      for (const s of sales) {
        if (String(s.source || "").toUpperCase() !== "POS") continue;
        if (s.billingId != null && Number(s.billingId) === Number(r.id)) {
          return s;
        }
        if (s.petId == null || Number(s.petId) !== Number(r.petId)) continue;
        const sa = Number(s.amount) || 0;
        if (Math.abs(sa - amt) > 0.02) continue;
        const oc = s.occurredAt ? new Date(s.occurredAt).getTime() : 0;
        const d = Math.abs(oc - paid);
        if (d < bestDelta && d < 120000) {
          bestDelta = d;
          best = s;
        }
      }
      return best;
    }

    function receiptNo(sale) {
      if (!sale || !sale.id) return "—";
      const y = sale.occurredAt ? new Date(sale.occurredAt).getFullYear() : new Date().getFullYear();
      return `RCPT-${y}-${String(sale.id).padStart(4, "0")}`;
    }

    function localDateInputValue(d) {
      const x = d instanceof Date ? d : new Date(d);
      const y = x.getFullYear();
      const m = String(x.getMonth() + 1).padStart(2, "0");
      const day = String(x.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function ensureDateRangeIncludesToday() {
      const periodEl = document.getElementById("billPeriod");
      if (!periodEl) return;
      // Keep preset filters on Today so new payments appear immediately.
      if (periodEl.value === "custom") {
        const today = localDateInputValue(new Date());
        const toEl = document.getElementById("dateTo");
        if (toEl && (!toEl.value || toEl.value < today)) toEl.value = today;
        return;
      }
      periodEl.value = "day";
      syncCustomDateVisibility();
    }

    function recordTimestamp(r) {
      const st = String(r.status || "").toUpperCase();
      const raw = st === "PAID" && r.paidAt ? r.paidAt : r.issuedAt || r.paidAt;
      return raw ? new Date(raw).getTime() : 0;
    }

    function startOfDay(d) {
      const x = new Date(d);
      x.setHours(0, 0, 0, 0);
      return x.getTime();
    }

    function endOfDay(d) {
      const x = new Date(d);
      x.setHours(23, 59, 59, 999);
      return x.getTime();
    }

    function syncCustomDateVisibility() {
      const period = document.getElementById("billPeriod")?.value || "day";
      const wrap = document.getElementById("billCustomDates");
      if (wrap) wrap.classList.toggle("hidden", period !== "custom");
    }

    function resolveBillRange() {
      const period = document.getElementById("billPeriod")?.value || "day";
      const today = new Date();
      const t0 = startOfDay(today);
      let start;
      let end = endOfDay(today);
      if (period === "day") {
        start = t0;
      } else if (period === "week") {
        const s = new Date(today);
        s.setHours(0, 0, 0, 0);
        s.setDate(s.getDate() - 6);
        start = s.getTime();
      } else if (period === "month") {
        start = startOfDay(new Date(today.getFullYear(), today.getMonth(), 1));
      } else {
        const from = document.getElementById("dateFrom")?.value;
        const to = document.getElementById("dateTo")?.value;
        if (!from || !to) return null;
        const pFrom = from.split("-").map(Number);
        const pTo = to.split("-").map(Number);
        start = startOfDay(new Date(pFrom[0], pFrom[1] - 1, pFrom[2]));
        end = endOfDay(new Date(pTo[0], pTo[1] - 1, pTo[2]));
      }
      return { start, end, period };
    }

    function initDateRange() {
      const periodEl = document.getElementById("billPeriod");
      if (periodEl) periodEl.value = "day";
      const today = localDateInputValue(new Date());
      const fromEl = document.getElementById("dateFrom");
      const toEl = document.getElementById("dateTo");
      if (fromEl) fromEl.value = today;
      if (toEl) toEl.value = today;
      syncCustomDateVisibility();
    }

    function inDateRange(r) {
      const range = resolveBillRange();
      if (!range) return true;
      const t = recordTimestamp(r);
      if (!t) return true;
      return t >= range.start && t <= range.end;
    }

    function filteredRows() {
      const q = (document.getElementById("searchInp").value || "").trim().toLowerCase();
      return billing.filter((r) => {
        if (!inDateRange(r)) return false;
        if (!q) return true;
        const inv = invoiceNo(r).toLowerCase();
        const lineNames = (r.lines || []).map((l) => l.serviceName || "").join(" ");
        const str = `${inv} ${r.petName || ""} ${r.ownerName || ""} ${r.description || ""} ${lineNames}`.toLowerCase();
        return str.includes(q);
      });
    }

    function counts() {
      const rows = billing.filter(inDateRange);
      const paid = rows.filter((r) => String(r.status).toUpperCase() === "PAID");
      const pend = rows.filter((r) => String(r.status).toUpperCase() === "PENDING");
      return { all: rows.length, paid: paid.length, pending: pend.length };
    }

    function sumAmount(arr) {
      return arr.reduce((a, r) => a + (Number(r.amount) || 0), 0);
    }

    function renderKpis() {
      const rows = billing.filter(inDateRange);
      const paidRows = rows.filter((r) => String(r.status).toUpperCase() === "PAID");
      const pendRows = rows.filter((r) => String(r.status).toUpperCase() === "PENDING");
      const today = new Date();
      const t0 = startOfDay(today);
      const t1 = endOfDay(today);
      const paidToday = paidRows.filter((r) => {
        const pt = r.paidAt ? new Date(r.paidAt).getTime() : 0;
        return pt >= t0 && pt <= t1;
      });
      const totalToday = sumAmount(paidToday);
      const totalPaid = sumAmount(paidRows);
      const totalPend = sumAmount(pendRows);

      document.getElementById("kpiRow").innerHTML = `
        <div class="bp-dash-stat">
          <div class="bp-dash-stat-inner">
            <div>
              <div class="text-xs font-medium text-[#667085]">Collected today</div>
              <div class="bp-dash-stat-value mt-1">₱${fmtMoney(totalToday)}</div>
            </div>
            <div class="bp-stat-icon bp-stat-icon--green" aria-hidden="true"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>
          </div>
        </div>
        <div class="bp-dash-stat">
          <div class="bp-dash-stat-inner">
            <div>
              <div class="text-xs font-medium text-[#667085]">Pending</div>
              <div class="bp-dash-stat-value mt-1">₱${fmtMoney(totalPend)}</div>
              <div class="bp-dash-stat-label mt-1">${pendRows.length} invoice${pendRows.length === 1 ? "" : "s"}</div>
            </div>
            <div class="bp-stat-icon bp-stat-icon--amber" aria-hidden="true"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>
          </div>
        </div>
        <div class="bp-dash-stat">
          <div class="bp-dash-stat-inner">
            <div>
              <div class="text-xs font-medium text-[#667085]">Paid in period</div>
              <div class="bp-dash-stat-value mt-1">₱${fmtMoney(totalPaid)}</div>
            </div>
            <div class="bp-stat-icon bp-stat-icon--blue" aria-hidden="true"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>
          </div>
        </div>`;

      const cts = counts();
      document.getElementById("tabRow").className = "bp-filter-tabs";
      document.getElementById("tabRow").innerHTML = [
        ["all", `All (${cts.all})`],
        ["PENDING", `Pending (${cts.pending})`],
        ["PAID", `Paid (${cts.paid})`],
      ]
        .map(
          ([key, label]) =>
            `<button type="button" data-tab="${key}" class="bp-filter-tab${tab === key ? " is-active" : ""}">${esc(label)}</button>`,
        )
        .join("");
    }

    function tabFilter(rows) {
      if (tab === "all") return rows;
      return rows.filter((r) => String(r.status || "").toUpperCase() === tab);
    }

    function statusPill(st) {
      return typeof bpStatusBadge === "function" ? bpStatusBadge(st) : `<span>${esc(st)}</span>`;
    }

    function renderTable() {
      let rows = tabFilter(filteredRows());
      rows.sort((a, b) => String(b.issuedAt || "").localeCompare(String(a.issuedAt || "")));
      const total = rows.length;
      const pages = Math.max(1, Math.ceil(total / pageSize));
      if (page > pages) page = pages;
      const start = (page - 1) * pageSize;
      const slice = rows.slice(start, start + pageSize);

      document.getElementById("pageSummary").textContent =
        total === 0 ? "No invoices in this view" : `Showing ${start + 1} to ${Math.min(start + pageSize, total)} of ${total} invoices`;
      document.getElementById("pageNum").textContent = String(page);
      document.getElementById("pagePrev").disabled = page <= 1;
      document.getElementById("pageNext").disabled = page >= pages;

      const body = document.getElementById("billingRows");
      closeBillMenu();
      if (!slice.length) {
        body.innerHTML = `<tr><td colspan="6">${typeof bpEmptyState === "function" ? bpEmptyState("No invoices match your search.", "search", "bp-empty-state--table") : `<div class="px-4 py-12 text-center text-slate-400">No invoices match your search.</div>`}</td></tr>`;
        return;
      }
      body.innerHTML = slice
        .map((r) => {
          const inv = invoiceNo(r);
          return `<tr class="bill-row hover:bg-slate-50/80" data-id="${r.id}">
            <td class="font-medium text-[#101828] cursor-pointer bill-row-main">${esc(inv)}</td>
            <td class="cursor-pointer bill-row-main">
              <div class="font-medium text-slate-900">${esc(r.petName || "—")}</div>
              <div class="text-[13px] text-[#667085]">${esc(r.ownerName || "—")}</div>
            </td>
            <td class="text-slate-600 hidden md:table-cell whitespace-nowrap cursor-pointer bill-row-main">${esc(fmtDateTime(r.issuedAt))}</td>
            <td class="text-right font-bold tabular-nums text-slate-900 cursor-pointer bill-row-main">₱${fmtMoney(r.amount)}</td>
            <td class="cursor-pointer bill-row-main">${statusPill(r.status)}</td>
            <td class="text-right">
              <button type="button" class="bill-row-menu-btn" data-id="${r.id}" aria-label="Actions" aria-haspopup="menu" aria-expanded="false">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="8" cy="3" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="8" cy="13" r="1.5"/></svg>
              </button>
            </td>
          </tr>`;
        })
        .join("");
    }

    function closeBillMenu() {
      document.querySelectorAll(".bill-actions-menu").forEach((el) => el.remove());
      document.querySelectorAll(".bill-row-menu-btn[aria-expanded='true']").forEach((btn) => {
        btn.setAttribute("aria-expanded", "false");
      });
    }

    function positionBillMenu(menu, btn) {
      const rect = btn.getBoundingClientRect();
      const menuWidth = Math.max(menu.offsetWidth || 184, 184);
      const menuHeight = menu.offsetHeight || 160;
      let left = rect.right - menuWidth;
      let top = rect.bottom + 6;
      if (left < 8) left = 8;
      if (left + menuWidth > window.innerWidth - 8) left = window.innerWidth - menuWidth - 8;
      if (top + menuHeight > window.innerHeight - 8 && rect.top > menuHeight + 8) {
        top = rect.top - menuHeight - 6;
      }
      menu.style.left = left + "px";
      menu.style.top = top + "px";
    }

    function askVoidReason(invoiceLabel) {
      return new Promise((resolve) => {
        const modal = document.getElementById("voidReasonModal");
        const input = document.getElementById("voidReasonInput");
        const err = document.getElementById("voidReasonError");
        const label = document.getElementById("voidReasonLabel");
        const cancelBtn = document.getElementById("voidReasonCancel");
        const confirmBtn = document.getElementById("voidReasonConfirm");
        if (!modal || !input || !cancelBtn || !confirmBtn) {
          resolve(null);
          return;
        }
        label.textContent = "Reason for voiding " + invoiceLabel + ".";
        input.value = "";
        err.classList.add("hidden");
        modal.classList.remove("hidden");
        modal.classList.add("flex");
        setTimeout(() => input.focus(), 30);

        const cleanup = () => {
          cancelBtn.onclick = null;
          confirmBtn.onclick = null;
          modal.onclick = null;
          input.onkeydown = null;
          modal.classList.add("hidden");
          modal.classList.remove("flex");
        };

        cancelBtn.onclick = () => {
          cleanup();
          resolve(null);
        };
        confirmBtn.onclick = () => {
          const reason = String(input.value || "").trim();
          if (reason.length < 3) {
            err.classList.remove("hidden");
            input.focus();
            return;
          }
          cleanup();
          resolve(reason);
        };
        modal.onclick = (e) => {
          if (e.target.id === "voidReasonModal") {
            cleanup();
            resolve(null);
          }
        };
        input.onkeydown = (e) => {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            confirmBtn.click();
          } else if (e.key === "Escape") {
            e.preventDefault();
            cancelBtn.click();
          }
        };
      });
    }

    function parseSaleNoteLines(note) {
      if (!note) return [];
      const out = [];
      const chunk = note.includes(". ") ? note.split(". ").slice(1).join(". ") : note;
      for (const part of chunk.split(" | ")) {
        const m = part.match(/^(.+?) ×(\d+) @ ₱([\d,]+(?:\.\d{2})?)/);
        if (!m) continue;
        const qty = Number(m[2]) || 1;
        const unit = Number(String(m[3]).replace(/,/g, "")) || 0;
        out.push({ description: m[1].trim(), qty, amount: unit * qty });
      }
      return out;
    }

    async function resolveReceiptLines(r) {
      const billed = Array.isArray(r?.lines) ? r.lines.filter((l) => l && (l.serviceName || l.serviceCost != null)) : [];
      if (billed.length) {
        return billed.map((l) => ({
          description: l.serviceName || "Service",
          qty: 1,
          amount: Number(l.serviceCost) || 0,
        }));
      }
      const sale = findSaleForBilling(r);
      if (sale && sale.id) {
        try {
          const receipt = await Api.sales.receipt(sale.id);
          if (receipt && Array.isArray(receipt.lines) && receipt.lines.length) {
            return receipt.lines.map((l) => ({
              description: l.itemName || "Item",
              qty: l.quantity || 1,
              amount: Number(l.lineTotal) || 0,
            }));
          }
        } catch (_) {}
        const parsed = parseSaleNoteLines(sale.note);
        if (parsed.length) return parsed;
      }
      const desc = String(r.description || "").trim();
      const generic = !desc || /^pos (checkout|sale)$/i.test(desc);
      if (!generic) {
        return [{ description: desc, qty: 1, amount: Number(r.amount) || 0 }];
      }
      return [{ description: "Service", qty: 1, amount: Number(r.amount) || 0 }];
    }

        .muted{color:#667085;font-size:${preview ? "14px" : "11px"};margin:2px 0 0}

        .meta p{margin:0}
        .who{margin:${preview ? "16px" : "8px"} 0 0;font-size:${preview ? "16px" : "12px"}}
        table{width:100%;border-collapse:collapse;margin-top:${preview ? "16px" : "8px"}}
        th{font-size:${preview ? "13px" : "11px"};text-transform:uppercase;color:#667085;border-bottom:1px solid #EAECF0;padding:${preview ? "8px 4px" : "4px 2px"};text-align:left;font-weight:600}

        .right{text-align:right}
        .totalRow td{font-weight:600;border-top:1px solid #101828}
      </style></head><body>
      <div class="head">

          <img src="${logoSrc}" alt=""/>

            <p><strong>${clinicName}</strong></p>

        <div class="meta">
          <p class="invoice">${inv}</p>
          <p><strong>Issue</strong> ${esc(fmtDateTime(r.issuedAt))}</p>
          <p><strong>Status</strong> ${esc(r.status)}</p>

        <thead><tr><th>Description</th><th class="right">Qty</th><th class="right">Amount</th></tr></thead>
        <tbody>
          ${lineRows}
          ${discountRow}
          <tr class="totalRow"><td colspan="2" class="right">Total</td><td class="right">₱${fmtMoney(total)}</td></tr>
        </tbody>
      </table>

      const lines = await resolveReceiptLines(row);
      const html = billReceiptHtml(row, lines);
      const preferredPrinter = typeof getPreferredReceiptPrinter === "function" ? getPreferredReceiptPrinter() : "";
      if (window.desktopBridge?.printReceipt) {
        const res = await window.desktopBridge.printReceipt({ html, silent: false, deviceName: preferredPrinter || undefined });
        if (!res || !res.ok) {
          await queueCloudPrint(html, preferredPrinter || "");
          toast("Local print failed; queued to cloud print.", true);
          return;
        }
      } else {
        await queueCloudPrint(html, preferredPrinter || "");
        toast("Receipt queued for cloud print.", false);
      }
    }

      sessionStorage.removeItem("posPrefillPetId");
      sessionStorage.removeItem("posPrefillDiscount");
      sessionStorage.removeItem("posFocusPendingBilling");
      if (row) {
        openBayportPaymentModal({
          billingRow: row,
          petId: row.petId,
        });
      }
    });
    setInterval(loadAll, 60000);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") loadAll();
    });
    window.addEventListener("bayport:sale-recorded", () => {
      ensureDateRangeIncludesToday();
      loadAll();
    });
    let billingSalesStream = null;
    function connectBillingSalesStream() {
      if (billingSalesStream || typeof Api === "undefined" || !Api.sales?.stream) return;
      try {
        billingSalesStream = Api.sales.stream();
        billingSalesStream.addEventListener("sale", () => {
          if (document.visibilityState === "visible") {
            ensureDateRangeIncludesToday();
            loadAll();
          }
        });
        billingSalesStream.onerror = () => {
          try {
            billingSalesStream.close();
          } catch (_) {
            /* ignore */
          }
          billingSalesStream = null;
          setTimeout(connectBillingSalesStream, 15000);
        };
      } catch (_) {
        billingSalesStream = null;
      }
    }
    connectBillingSalesStream();
  </script>
</body>
</html>
