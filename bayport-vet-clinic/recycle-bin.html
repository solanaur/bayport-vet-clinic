<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recycle Bin - Bayport</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/bayport-design.css">
  <style>:root{--soft-teal:#0F5CC0;--bp-primary:#0F5CC0}</style>
</head>
<body class="min-h-screen flex flex-col" style="background-color: var(--bp-bg);">
  <header id="bpAppHeader"></header>

  <div class="flex flex-1 min-h-0">
    <aside class="w-64 lg:w-72 bg-white border-r border-gray-200 p-5 shrink-0 hidden md:block">
      <nav id="sidebarNav" class="flex flex-col gap-1"></nav>
    </aside>

    <main class="flex-1 p-5 lg:p-8 min-w-0 overflow-y-auto">
      <div class="max-w-5xl mx-auto space-y-5">
        <div class="flex items-center justify-between gap-4">
          <h1 class="bp-page-title">Deleted Items</h1>
          <button id="refreshBtn" class="bp-btn-primary">Refresh</button>
        </div>
        
        <div id="recycleBinContainer" class="space-y-5">
        </div>
      </div>
    </main>
  </div>

  <script src="assets/deploy-env.js"></script>

  <script src="assets/api.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/app-header.js"></script>
  <script>
    guard('recycle-bin');
    if (typeof initBayportAppHeader === "function") initBayportAppHeader(document.getElementById("bpAppHeader"), { accent: "soft-teal" });
    const role = getRole();
    if (role !== 'admin') {
      location.href = 'dashboard.html';
    }
    renderSidebar(document.getElementById('sidebarNav'), role, 'recycle-bin.html');

    const container = document.getElementById('recycleBinContainer');
    const refreshBtn = document.getElementById('refreshBtn');

    function formatTimestamp(timestamp) {
      if (!timestamp) return 'N/A';
      const date = new Date(timestamp);
      return date.toLocaleString('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    async function loadRecycleBin() {
      try {
        const token = localStorage.getItem('token') || localStorage.getItem('jwt');
        const response = await fetch(`${window.API_BASE || 'http://localhost:8080/api'}/admin/recycle-bin`, {
          headers: {
            'Authorization': token ? `Bearer ${token}` : '',
            'Content-Type': 'application/json'
          }
        });
        
        if (!response.ok) {
          throw new Error('Failed to load recycle bin');
        }
        
        const data = await response.json();
        const sections = [
          { key: 'owners', title: 'Owners', label: row => row.fullName || row.name || 'Owner', restore: 'owners', purge: false },
          { key: 'pets', title: 'Pets', label: row => `${row.name || 'Unknown'} - ${row.owner || 'Unknown Owner'}`, restore: 'pets', purge: true },
          { key: 'appointments', title: 'Appointments', label: row => `${row.date || ''} ${row.time || ''} ${row.owner || ''}`.trim(), restore: 'appointments', purge: true },
          { key: 'prescriptions', title: 'Prescriptions', label: row => `${row.pet || 'Pet'} — ${row.drug || 'Medicine'}`, restore: 'prescriptions', purge: false },
          { key: 'invoices', title: 'Invoices', label: row => `${row.ownerName || 'Owner'} — ${row.amount ?? ''}`, restore: 'invoices', purge: false }
        ];

        let html = '';
        sections.forEach(section => {
          const rows = data[section.key] || [];
          if (!rows.length) return;
          html += `
            <div class="border border-gray-200 rounded-xl p-6">
              <h4 class="text-lg font-semibold text-gray-800 mb-4 pb-2 border-b border-gray-200">Deleted ${section.title} (${rows.length})</h4>
              <div class="space-y-2">
                ${rows.map(row => `
                  <div class="p-3 bg-gray-50 rounded-md border border-gray-100 flex justify-between items-center">
                    <div class="flex-1">
                      <div class="text-sm font-medium text-gray-800">${section.label(row)}</div>
                      <div class="text-xs text-gray-500 mt-1">Deleted by: ${row.deletedBy || 'System'} | ${formatTimestamp(row.deletedAt)}</div>
                    </div>
                    <div class="flex gap-2 ml-4">
                      <button class="px-3 py-1 bg-green-600 text-white rounded-md text-sm hover:bg-green-700" onclick="restoreRecord('${section.restore}', ${row.id})">Restore</button>
                      ${section.purge ? `<button class="px-3 py-1 bg-red-600 text-white rounded-md text-sm hover:bg-red-700" onclick="purgeRecord('${section.restore}', ${row.id})">Delete Permanently</button>` : ''}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        });

        if (!html) {
          html = '<div class="text-center text-gray-500 py-8">Recycle bin is empty.</div>';
        }
        
        container.innerHTML = html;
      } catch (err) {
        console.error('Error loading recycle bin:', err);
        container.innerHTML = `<div class="text-center text-red-500 py-8">Error loading recycle bin: ${err.message}</div>`;
      }
    }

    async function recycleAction(path, method, confirmText) {
      if (!await window.bayportConfirm(confirmText)) return;
      try {
        const token = localStorage.getItem('token') || localStorage.getItem('jwt');
        const response = await fetch(`${window.API_BASE}/admin/recycle-bin/${path}`, {
          method,
          headers: {
            'Authorization': token ? `Bearer ${token}` : '',
            'Content-Type': 'application/json'
          }
        });
        if (response.ok) {
          loadRecycleBin();
          return;
        }
        const result = await response.json();
        alert(result.error || 'The server refused that action.');
      } catch (err) {
        alert(err.message);
      }
    }

    function restoreRecord(kind, id) {
      return recycleAction(`${kind}/${id}/restore`, 'POST', 'Restore this record?');
    }

    function purgeRecord(kind, id) {
      return recycleAction(`${kind}/${id}`, 'DELETE', 'Permanently delete this record? Prescriptions and invoices stay in the bin.');
    }

    refreshBtn.onclick = loadRecycleBin;
    
    // Initial load
    loadRecycleBin();
  </script>
</body>
</html>
