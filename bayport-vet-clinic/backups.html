<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Backups - Bayport</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/bayport-design.css">
</head>
<body class="min-h-screen flex flex-col" style="background-color: var(--bp-bg);">
  <header id="bpAppHeader"></header>
  <div class="flex flex-1 min-h-0">
    <aside class="w-64 lg:w-72 bg-white border-r border-gray-200 p-5 shrink-0 hidden md:block">
      <nav id="sidebarNav" class="flex flex-col gap-1"></nav>
    </aside>
    <main class="flex-1 p-5 lg:p-8 min-w-0 overflow-y-auto">
      <div class="max-w-4xl mx-auto space-y-5">
        <div class="flex items-center justify-between gap-4">
          <h1 class="bp-page-title">Backups</h1>
          <button id="backupNow" class="bp-btn-primary" type="button">Back up now</button>
        </div>
        <p id="statusLine" class="text-sm text-gray-700"></p>
        <div id="backupList" class="space-y-3"></div>
      </div>
    </main>
  </div>
  <script src="assets/deploy-env.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/app-header.js"></script>
  <script>
    guard("backups");
    if (typeof initBayportAppHeader === "function") initBayportAppHeader(document.getElementById("bpAppHeader"), { accent: "soft-teal" });

    function esc(value) {
      return String(value ?? "").replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
    }

    async function refresh() {
      const status = await Api.backups.status();
      document.getElementById("statusLine").textContent = status.message || "";
      const rows = await Api.backups.list();
      const host = document.getElementById("backupList");
      host.innerHTML = "";
      if (!rows.length) {
        host.innerHTML = "<p class='text-sm text-gray-600'>No backup files yet.</p>";
        return;
      }
      for (const row of rows) {
        const card = document.createElement("div");
        card.className = "bg-white border border-gray-200 rounded-lg p-4 flex flex-wrap items-center justify-between gap-3";
        card.innerHTML = `<div><p class="font-semibold">${esc(row.id)}</p><p class="text-xs text-gray-500">${esc(row.sizeBytes)} bytes</p></div>
          <div class="flex gap-2">
            <button type="button" class="bp-btn-primary" data-download="${esc(row.id)}">Download</button>
            <button type="button" class="bp-btn-primary" data-restore="${esc(row.id)}" data-confirm="${esc(row.confirm)}">Restore</button>
          </div>`;
        host.appendChild(card);
      }
    }

    document.getElementById("backupNow").addEventListener("click", async () => {
      document.getElementById("backupNow").disabled = true;
      try {
        await Api.backups.create();
        await refresh();
      } catch (err) {
        alert(err.message || "Backup did not finish.");
      } finally {
        document.getElementById("backupNow").disabled = false;
      }
    });

    document.getElementById("backupList").addEventListener("click", async (event) => {
      const download = event.target.getAttribute("data-download");
      const restore = event.target.getAttribute("data-restore");
      if (download) {
        await Api.backups.download(download);
        return;
      }
      if (!restore) return;
      const phrase = event.target.getAttribute("data-confirm");
      const ask = window.bayportPrompt || window.prompt;
      const typed = await ask("This replaces the live database. A safety backup is taken first. Type " + phrase + " to continue.", { title: "Restore backup" });
      if (typed !== phrase) return;
      try {
        const result = await Api.backups.restore(restore, typed);
        alert(result.message || "Restore finished.");
      } catch (err) {
        alert(err.message || "Restore did not finish.");
      }
    });

    refresh().catch((err) => {
      document.getElementById("statusLine").textContent = err.message || "Could not load backups.";
    });
  </script>
</body>
</html>
