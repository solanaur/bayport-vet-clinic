<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Backups - Bayport</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/bayport-design.css?v=20261105c">
</head>
<body class="min-h-screen flex flex-col" style="background-color: var(--bp-bg);">
  <header id="bpAppHeader"></header>
  <div class="flex flex-1 min-h-0">
    <aside class="w-64 lg:w-72 bg-white border-r border-gray-200 p-5 shrink-0 hidden md:block">
      <nav id="sidebarNav" class="flex flex-col gap-1"></nav>
    </aside>
    <main class="flex-1 p-5 lg:p-8 min-w-0 overflow-y-auto">
      <div class="max-w-4xl mx-auto space-y-5">
        <div class="flex items-start justify-between gap-4">
          <div class="min-w-0">
            <h1 class="bp-page-title">Backups</h1>
            <p class="bp-page-desc">Automatic daily backups run on the server and are stored securely. Download a backup only when you need a local copy. Restoring may replace current database records.</p>
          </div>
          <button id="backupNow" class="bp-btn-primary shrink-0" type="button">Back up now</button>
        </div>
        <div id="backupMeta" class="bp-card p-4 flex flex-wrap items-center justify-between gap-3">
          <div class="min-w-0">
            <p class="text-[11px] uppercase tracking-wide text-[#667085] font-semibold">Last backup</p>
            <p id="lastBackupWhen" class="text-base font-semibold text-slate-900 mt-0.5">Checking…</p>
            <p id="statusLine" class="text-sm text-slate-600 mt-1"></p>
          </div>
          <div id="backupRunningBadge" class="hidden items-center gap-2 rounded-full bg-amber-50 text-amber-800 border border-amber-200 px-3 py-1.5 text-sm font-medium">
            <span class="inline-block w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
            Backup running…
          </div>
        </div>
        <div id="backupList" class="space-y-3"></div>
      </div>
    </main>
  </div>
  <script src="assets/deploy-env.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/app.js?v=20261105c"></script>
  <script src="assets/app-header.js?v=20261105c"></script>
  <script>
    guard("backups");
    if (typeof initBayportAppHeader === "function") initBayportAppHeader(document.getElementById("bpAppHeader"), { accent: "soft-teal" });
    renderSidebar(document.getElementById("sidebarNav"), getRole(), "backups.html");

    let backupBusy = false;

    function esc(value) {
      return String(value ?? "").replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
    }

    function formatSize(bytes) {
      const n = Number(bytes);
      if (!Number.isFinite(n) || n < 0) return "—";
      if (n < 1024) return n + " B";
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
      return (n / (1024 * 1024)).toFixed(1) + " MB";
    }

    function formatWhen(row) {
      if (row && row.finishedAtDisplay) return row.finishedAtDisplay;
      const match = String(row && row.id || "").match(/^bayport-(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})$/);
      if (!match) return "";
      const when = new Date(
        Number(match[1]),
        Number(match[2]) - 1,
        Number(match[3]),
        Number(match[4]),
        Number(match[5]),
        Number(match[6])
      );
      if (Number.isNaN(when.getTime())) return "";
      return when.toLocaleString(undefined, {
        month: "long",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit",
      });
    }

    function statusBadgeHtml(row) {
      const status = String(row && row.status || "").toUpperCase();
      if (typeof window.bpStatusBadge === "function") {
        if (status === "RUNNING") return '<span class="bp-badge bp-badge--pending">Running</span>';
        if (status === "UNREADABLE") return '<span class="bp-badge bp-badge--danger">Unreadable</span>';
        return window.bpStatusBadge(status || "Unknown");
      }
      return esc(status || "Unknown");
    }

    function setBusy(on) {
      backupBusy = !!on;
      const button = document.getElementById("backupNow");
      const runningBadge = document.getElementById("backupRunningBadge");
      if (button) {
        button.disabled = backupBusy;
        button.textContent = backupBusy ? "Backing up…" : "Back up now";
        button.classList.toggle("opacity-60", backupBusy);
      }
      if (runningBadge) {
        runningBadge.classList.toggle("hidden", !backupBusy);
        runningBadge.classList.toggle("flex", backupBusy);
      }
    }

    function paintStatus(status) {
      const whenEl = document.getElementById("lastBackupWhen");
      const statusEl = document.getElementById("statusLine");
      const when = (status && (status.finishedAtDisplay || status.finishedAt)) || "";
      if (whenEl) whenEl.textContent = when || "No successful backup yet";
      if (statusEl) statusEl.textContent = (status && status.message) || "";
      if (status && status.running && !backupBusy) {
        setBusy(true);
      }
    }

    async function refresh() {
      const status = await Api.backups.status();
      paintStatus(status);
      if (status && status.running) {
        setBusy(true);
      } else if (!window.__bayportBackupBusy) {
        setBusy(false);
      }
      const rows = await Api.backups.list();
      const host = document.getElementById("backupList");
      host.innerHTML = "";
      if (!rows.length) {
        host.innerHTML = "<p class='text-sm text-gray-600'>No backup files yet.</p>";
        return;
      }
      for (const row of rows) {
        const card = document.createElement("div");
        card.className = "bp-card p-4 flex flex-wrap items-center justify-between gap-3";
        const when = formatWhen(row);
        const filename = row.filename || (row.id + ".zip");
        card.innerHTML = `<div class="min-w-0">
            <p class="text-sm font-semibold text-slate-900">${esc(when || row.id)}</p>
            <p class="text-[13px] text-[#667085] mt-0.5">${esc(filename)} · ${esc(formatSize(row.sizeBytes))}${row.manual ? " · Manual" : ""}</p>
            <div class="mt-2">${statusBadgeHtml(row)}</div>
          </div>
          <div class="flex flex-wrap gap-2 shrink-0">
            <button type="button" class="bp-btn-secondary" data-download="${esc(row.id)}">Download</button>
            <button type="button" class="bp-btn-primary" data-restore="${esc(row.id)}" data-confirm="${esc(row.confirm)}" data-label="${esc(when || row.id)}">Restore</button>
          </div>`;
        host.appendChild(card);
      }
    }

    document.getElementById("backupNow").addEventListener("click", async () => {
      if (backupBusy || window.__bayportBackupBusy) {
        alert("A backup is already running.");
        return;
      }
      setBusy(true);
      try {
        const created = typeof window.bayportCreateBackup === "function"
          ? await window.bayportCreateBackup()
          : await Api.backups.create();
        if (!created || !created.ok) {
          throw new Error((created && created.message) || "Backup did not finish.");
        }
        await refresh();
        alert(created.message || ("Backup saved as " + (created.filename || (created.id + ".zip"))));
      } catch (err) {
        alert(err.message || "Backup did not finish.");
        await refresh().catch(() => {});
      } finally {
        setBusy(false);
      }
    });

    window.addEventListener("bayport-backup-started", () => {
      setBusy(true);
    });
    window.addEventListener("bayport-backup-finished", () => {
      setBusy(false);
    });
    window.addEventListener("bayport-backup-ready", () => {
      refresh().catch(() => {});
    });

    document.getElementById("backupList").addEventListener("click", async (event) => {
      const download = event.target.getAttribute("data-download");
      const restore = event.target.getAttribute("data-restore");
      if (download) {
        try {
          await Api.backups.download(download);
        } catch (err) {
          alert(err.message || "Download did not finish.");
        }
        return;
      }
      if (!restore) return;
      if (backupBusy || window.__bayportBackupBusy) {
        alert("Wait for the current backup to finish before restoring.");
        return;
      }
      const phrase = event.target.getAttribute("data-confirm");
      const label = event.target.getAttribute("data-label") || restore;
      const ask = window.bayportPrompt || window.prompt;
      const typed = await ask(
        "You selected backup:\n" + label + " (" + restore + ")\n\n"
          + "Restoring may replace current database records with data from this backup.\n"
          + "A safety backup of the current database is created first, and the selected backup is verified before restore continues.\n\n"
          + "Type " + phrase + " to continue.",
        { title: "Restore backup" }
      );
      if (String(typed || "").trim() !== String(phrase || "").trim()) {
        alert("Restore cancelled. Type the exact confirmation phrase to continue.");
        return;
      }
      setBusy(true);
      try {
        window.__bayportBackupBusy = true;
        const result = await Api.backups.restore(restore, String(typed || "").trim());
        await refresh();
        if (result && result.requiresRestart && result.pendingDir
            && window.desktopBridge && typeof window.desktopBridge.applyH2Restore === "function") {
          const restart = confirm(
            (result.message || "Restore is ready.")
              + "\n\nBayport must restart now to finish applying this backup. Continue?"
          );
          if (restart) {
            const applied = await window.desktopBridge.applyH2Restore(result.pendingDir);
            if (!applied || !applied.ok) {
              throw new Error((applied && applied.error) || "Desktop restore did not finish.");
            }
            return;
          }
          alert("Restore files are prepared. Restart Bayport later to finish applying this backup.");
          return;
        }
        alert(result.message || (result.ok ? "Restore finished." : "Restore did not finish."));
      } catch (err) {
        await refresh().catch(() => {});
        alert(err.message || "Restore did not finish.");
      } finally {
        window.__bayportBackupBusy = false;
        setBusy(false);
      }
    });

    refresh().catch((err) => {
      const whenEl = document.getElementById("lastBackupWhen");
      const statusEl = document.getElementById("statusLine");
      if (whenEl) whenEl.textContent = "Unavailable";
      if (statusEl) statusEl.textContent = err.message || "Could not load backups.";
    });
  </script>
</body>
</html>
