<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Activity Logs - Bayport</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/bayport-design.css?v=20261105c">
  <style>:root{--soft-teal:#0F5CC0;--bp-primary:#0F5CC0}</style>
</head>
<body class="min-h-screen flex flex-col" style="background-color: var(--bp-bg);">
  <header id="bpAppHeader"></header>

  <div class="flex flex-1 min-h-0 flex-col lg:flex-row">
    <aside class="w-full lg:w-64 xl:w-72 bg-white border-r border-gray-200 p-5 shrink-0 hidden md:block">
      <nav id="sidebarNav" class="flex flex-col gap-1"></nav>
    </aside>

    <main class="flex-1 p-5 lg:p-8 min-w-0 overflow-y-auto">
      <div class="max-w-6xl mx-auto space-y-5">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
          <h1 class="bp-page-title">Activity Log</h1>
          <div class="flex flex-wrap gap-2">
            <button id="selectAllBtn" class="bp-btn-secondary text-sm !h-9 !px-3 hidden">Select All</button>
            <button id="deleteSelectedBtn" class="bp-btn-danger text-sm !h-9 !px-3 hidden">Delete Selected</button>
            <button id="refreshBtn" class="bp-btn-primary text-sm !h-9 !px-3">Refresh</button>
          </div>
        </div>

        <div class="bp-toolbar border-b border-gray-200 pb-3">
          <div class="shrink-0 w-full sm:w-52">
            <label for="categoryFilter">Category</label>
            <select id="categoryFilter" class="w-full">
              <option value="ALL">All Activities (0)</option>
            </select>
          </div>
          <div class="flex-1 min-w-[12rem]">
            <label for="activitySearch">Search</label>
            <div class="bp-search">
              <svg class="bp-search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M11 18a7 7 0 100-14 7 7 0 000 14z"/></svg>
              <input id="activitySearch" type="search" class="bp-search-input" placeholder="Search description, user, or entity…"/>
            </div>
          </div>
        </div>

        <div id="activityLogsContainer" class="space-y-2.5 max-h-[calc(100vh-300px)] lg:max-h-[600px] overflow-y-auto w-full">
        </div>
        <div class="flex justify-center">
          <button id="loadMoreBtn" type="button" class="bp-btn-secondary text-sm !h-9 !px-4 hidden">Load more</button>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/deploy-env.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/app.js?v=20261105c"></script>
  <script src="assets/app-header.js?v=20261105c"></script>
  <script>
    guard('activity-logs');
    if (typeof initBayportAppHeader === "function") initBayportAppHeader(document.getElementById("bpAppHeader"), { accent: "soft-teal" });
    const role = getRole();
    if (role !== 'admin') {
      location.href = 'dashboard.html';
    }
    renderSidebar(document.getElementById('sidebarNav'), role, 'activity-logs.html');

    const container = document.getElementById('activityLogsContainer');
    const categoryFilter = document.getElementById('categoryFilter');
    const activitySearch = document.getElementById('activitySearch');
    const refreshBtn = document.getElementById('refreshBtn');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    const PAGE_SIZE = 50;

    const CATEGORY_OPTIONS = [
      { key: 'ALL', label: 'All Activities' },
      { key: 'AUTHENTICATION', label: 'Authentication' },
      { key: 'USERS_ROLES', label: 'Users & Roles' },
      { key: 'PETS', label: 'Pets' },
      { key: 'APPOINTMENTS', label: 'Appointments' },
      { key: 'PRESCRIPTIONS', label: 'Prescriptions' },
      { key: 'BILLING', label: 'Billing' },
      { key: 'INVENTORY', label: 'Inventory' },
      { key: 'BACKUPS', label: 'Backups' },
      { key: 'SECURITY', label: 'Security' },
      { key: 'SYSTEM', label: 'System' },
    ];

    let categories = [];
    let allActivities = [];
    let activeTab = 'ALL';
    let searchQuery = '';
    let visibleCount = PAGE_SIZE;
    let isSelectAllMode = false;

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function formatTimestamp(timestamp) {
      if (!timestamp) return 'N/A';
      const date = new Date(timestamp);
      if (Number.isNaN(date.getTime())) return esc(timestamp);
      return date.toLocaleString('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function deleteEndpoint(source, id) {
      const base = `${window.API_BASE || 'http://localhost:8080/api'}/admin/audit-logs`;
      if (source === 'operation') return `${base}/operations/${id}`;
      if (source === 'dataAccess') return `${base}/data-access/${id}`;
      return `${base}/${id}`;
    }

    function filteredActivities() {
      const q = searchQuery.trim().toLowerCase();
      let list = activeTab === 'ALL'
        ? allActivities
        : allActivities.filter((row) => row.category === activeTab);
      if (q) {
        list = list.filter((row) => {
          const hay = [
            row.message,
            row.action,
            row.username,
            row.entityName,
            row.entityId,
          ].map((v) => String(v || '').toLowerCase()).join(' ');
          return hay.includes(q);
        });
      }
      // Keep newest-first order from the API; filtering must not re-sort wrongly
      return list.slice().sort((a, b) => {
        const ta = new Date(a.timestamp || 0).getTime();
        const tb = new Date(b.timestamp || 0).getTime();
        if (tb !== ta) return tb - ta;
        return (Number(b.id) || 0) - (Number(a.id) || 0);
      });
    }

    function renderLogItem(log) {
      const timestamp = log.timestamp;
      const username = log.username || 'System';
      const message = log.message || log.action || '';
      const entity = log.entityName || '';
      const entityId = log.entityId || '';
      const id = log.id;
      const source = log.source || 'audit';

      return `
        <div class="bp-card px-4 py-3 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2 group hover:bg-slate-50" data-log-id="${esc(id)}" data-log-source="${esc(source)}">
          <div class="flex items-start gap-3 flex-1 min-w-0">
            <input type="checkbox" class="log-checkbox w-4 h-4 text-[var(--soft-teal)] border-gray-300 rounded focus:ring-[var(--soft-teal)] mt-1 flex-shrink-0" data-log-id="${esc(id)}" data-log-source="${esc(source)}">
            <div class="flex-1 min-w-0">
              <div class="text-sm font-medium text-slate-800 break-words leading-snug">${esc(message)}</div>
              ${entity ? `<div class="text-[13px] text-[#667085] mt-0.5 break-words">Entity: ${esc(entity)}${entityId ? ` (ID: ${esc(entityId)})` : ''}</div>` : ''}
              <div class="text-[13px] text-[#9CA3AF] mt-0.5">User: ${esc(username)}</div>
            </div>
          </div>
          <div class="flex items-center gap-3 sm:ml-4 flex-shrink-0 sm:w-40 sm:justify-end">
            <div class="text-[13px] text-[#667085] whitespace-nowrap tabular-nums text-right">${formatTimestamp(timestamp)}</div>
            <button onclick="deleteLog('${esc(source)}', ${Number(id)})" class="opacity-100 sm:opacity-0 sm:group-hover:opacity-100 text-red-600 hover:text-red-800 text-sm p-1.5 rounded" title="Delete log">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
              </svg>
            </button>
          </div>
        </div>
      `;
    }

    function renderTabContent() {
      const rows = filteredActivities();
      if (!rows.length) {
        container.innerHTML = '<div class="text-center text-gray-500 py-8">No logs found in this category.</div>';
        loadMoreBtn.classList.add('hidden');
        updateDeleteButtonVisibility();
        return;
      }

      const slice = rows.slice(0, visibleCount);
      container.innerHTML = slice.map(renderLogItem).join('');
      loadMoreBtn.classList.toggle('hidden', slice.length >= rows.length);
      updateDeleteButtonVisibility();
    }

    function countForCategory(key) {
      if (key === 'ALL') {
        const all = categories.find((c) => c.key === 'ALL');
        return all ? Number(all.count) || allActivities.length : allActivities.length;
      }
      const match = categories.find((c) => c.key === key);
      if (match) return Number(match.count) || 0;
      return allActivities.filter((row) => row.category === key).length;
    }

    function updateCategoryDropdown() {
      const previous = activeTab || 'ALL';
      categoryFilter.innerHTML = CATEGORY_OPTIONS.map((opt) => {
        const count = countForCategory(opt.key);
        return `<option value="${esc(opt.key)}">${esc(opt.label)} (${count})</option>`;
      }).join('');
      const valid = CATEGORY_OPTIONS.some((opt) => opt.key === previous);
      activeTab = valid ? previous : 'ALL';
      categoryFilter.value = activeTab;
    }

    function applyFilters(resetVisible) {
      if (resetVisible) visibleCount = PAGE_SIZE;
      isSelectAllMode = false;
      selectAllBtn.textContent = 'Select All';
      renderTabContent();
    }

    categoryFilter.addEventListener('change', () => {
      activeTab = categoryFilter.value || 'ALL';
      applyFilters(true);
    });

    activitySearch.addEventListener('input', () => {
      searchQuery = activitySearch.value || '';
      applyFilters(true);
    });

    window.deleteLog = async function(source, logId) {
      if (!await window.bayportConfirm('Are you sure you want to delete this log entry?')) return;

      try {
        const token = localStorage.getItem('token') || localStorage.getItem('jwt');
        const response = await fetch(deleteEndpoint(source, logId), {
          method: 'DELETE',
          headers: {
            'Authorization': token ? `Bearer ${token}` : '',
            'Content-Type': 'application/json'
          }
        });

        if (response.ok) {
          await loadActivityLogs();
        } else {
          const errorText = await response.text();
          alert('Failed to delete log entry: ' + errorText);
        }
      } catch (err) {
        console.error('Error deleting log:', err);
        alert('Error deleting log entry: ' + err.message);
      }
    };

    async function loadActivityLogs() {
      try {
        container.innerHTML = '<div class="text-center text-gray-500 py-8">Loading…</div>';
        const token = localStorage.getItem('token') || localStorage.getItem('jwt');
        const response = await fetch(`${window.API_BASE || 'http://localhost:8080/api'}/admin/audit-logs/organized?page=0&size=2000`, {
          headers: {
            'Authorization': token ? `Bearer ${token}` : '',
            'Content-Type': 'application/json'
          }
        });

        if (!response.ok) {
          if (response.status === 403) {
            throw new Error('Access denied. Admin access required.');
          }
          const errorText = await response.text();
          throw new Error(`Failed to load activity logs: ${response.status} ${errorText}`);
        }

        const data = await response.json();
        categories = Array.isArray(data.categories) ? data.categories : [];
        allActivities = Array.isArray(data.activities) ? data.activities : [];

        visibleCount = PAGE_SIZE;
        updateCategoryDropdown();
        renderTabContent();
      } catch (err) {
        console.error('Error loading activity logs:', err);
        container.innerHTML = `<div class="text-center text-red-500 py-8">Error loading activity logs: ${esc(err.message)}</div>`;
        loadMoreBtn.classList.add('hidden');
      }
    }

    refreshBtn.onclick = loadActivityLogs;
    loadMoreBtn.onclick = () => {
      visibleCount += PAGE_SIZE;
      renderTabContent();
    };

    const selectAllBtn = document.getElementById('selectAllBtn');
    const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');

    selectAllBtn.onclick = function() {
      isSelectAllMode = !isSelectAllMode;
      const checkboxes = container.querySelectorAll('.log-checkbox');
      checkboxes.forEach(cb => {
        cb.checked = isSelectAllMode;
      });
      selectAllBtn.textContent = isSelectAllMode ? 'Deselect All' : 'Select All';
      updateDeleteButtonVisibility();
    };

    deleteSelectedBtn.onclick = async function() {
      const checkboxes = container.querySelectorAll('.log-checkbox:checked');
      if (checkboxes.length === 0) {
        alert('Please select at least one log to delete.');
        return;
      }

      if (!await window.bayportConfirm(`Are you sure you want to delete ${checkboxes.length} log entry(ies)?`)) {
        return;
      }

      const token = localStorage.getItem('token') || localStorage.getItem('jwt');
      const deletePromises = [];

      for (const checkbox of checkboxes) {
        const logId = parseInt(checkbox.dataset.logId, 10);
        const source = checkbox.dataset.logSource || 'audit';
        deletePromises.push(
          fetch(deleteEndpoint(source, logId), {
            method: 'DELETE',
            headers: {
              'Authorization': token ? `Bearer ${token}` : '',
              'Content-Type': 'application/json'
            }
          })
        );
      }

      try {
        await Promise.all(deletePromises);
        await loadActivityLogs();
        isSelectAllMode = false;
        selectAllBtn.textContent = 'Select All';
      } catch (err) {
        console.error('Error deleting logs:', err);
        alert('Error deleting some log entries. Please refresh and try again.');
      }
    };

    function updateDeleteButtonVisibility() {
      const checkboxes = container.querySelectorAll('.log-checkbox');
      const checkedCount = container.querySelectorAll('.log-checkbox:checked').length;

      if (checkboxes.length > 0) {
        selectAllBtn.classList.remove('hidden');
        deleteSelectedBtn.classList.remove('hidden');
        deleteSelectedBtn.textContent = checkedCount > 0
          ? `Delete Selected (${checkedCount})`
          : 'Delete Selected';
      } else {
        selectAllBtn.classList.add('hidden');
        deleteSelectedBtn.classList.add('hidden');
      }
    }

    container.addEventListener('change', function(e) {
      if (e.target.classList.contains('log-checkbox')) {
        updateDeleteButtonVisibility();
      }
    });

    loadActivityLogs();
  </script>
</body>
</html>
